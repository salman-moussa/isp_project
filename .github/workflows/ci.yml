name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.project.outputs.node }}
      integration: ${{ steps.project.outputs.integration }}
    steps:
      - uses: actions/checkout@v6
      - id: project
        name: Detect guarded project capabilities
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "integration=false" >> "$GITHUB_OUTPUT"
            echo "No root Node manifest yet; bootstrap detection completed."
            exit 0
          fi
          if [[ ! -f package-lock.json ]]; then
            echo "A root package.json requires a committed package-lock.json." >&2
            exit 1
          fi
          echo "node=true" >> "$GITHUB_OUTPUT"
          node -e 'const p=require("./package.json"); if (!p.scripts?.["test:integration"]) throw new Error("test:integration is required")'
          echo "integration=true" >> "$GITHUB_OUTPUT"

  # Runs before every other gate: a CRLF blob or a non-executable provisioning script
  # breaks production deployment while passing lint, typecheck, and tests.
  packaging:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Verify release packaging contract
        run: node scripts/release/verify-release-packaging.mjs

  quality:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies
        run: npm ci --audit=false
      - name: Run applicable repository gates
        shell: bash
        run: |
          set -euo pipefail
          for script in format:check lint typecheck test build brand:check smoke:api db:check; do
            if node -e 'const p=require("./package.json"); process.exit(p.scripts?.[process.argv[1]] ? 0 : 1)' "$script"; then
              npm run "$script"
            else
              echo "::notice::Skipping absent bootstrap script: $script"
            fi
          done

  integration:
    needs: detect
    if: needs.detect.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: orvex-isp-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ORVEX_REQUIRE_LIVE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@11.17.0
      - run: npm ci --audit=false
      - name: Start isolated integration dependencies
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Export allocated dependency endpoints
        shell: bash
        run: |
          set -euo pipefail
          pg_port="$(docker compose -f docker-compose.test.yml port postgres-test 5432 | sed 's/.*://')"
          finance_upgrade_pg_port="$(docker compose -f docker-compose.test.yml port postgres-finance-upgrade-test 5432 | sed 's/.*://')"
          redis_port="$(docker compose -f docker-compose.test.yml port redis-test 6379 | sed 's/.*://')"
          minio_port="$(docker compose -f docker-compose.test.yml port minio-test 9000 | sed 's/.*://')"
          {
            echo "DATABASE_MIGRATION_URL=postgresql://orvex_migrator:test-only-migrator-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "DATABASE_RUNTIME_URL=postgresql://orvex_runtime:test-only-runtime-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "CONTROL_DATABASE_MIGRATION_URL=postgresql://orvex_migrator:test-only-migrator-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "TENANT_DATABASE_MIGRATION_URL=postgresql://orvex_migrator:test-only-migrator-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "CONTROL_FINANCE_AUDIT_RELAY_DATABASE_URL=postgresql://orvex_finance_audit_relay:test-only-relay-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "TENANT_FINANCE_AUDIT_RELAY_DATABASE_URL=postgresql://orvex_finance_audit_relay:test-only-relay-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "TENANT_FINANCE_AUDIT_RUNTIME_DATABASE_URL=postgresql://orvex_runtime:test-only-runtime-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "TENANT_FINANCE_AUDIT_MIGRATION_DATABASE_URL=postgresql://orvex_migrator:test-only-migrator-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "OPERATIONS_TEST_ADMIN_DATABASE_URL=postgresql://orvex_bootstrap_test:test-only-bootstrap-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "OPERATIONS_TEST_RUNTIME_DATABASE_URL=postgresql://orvex_runtime:test-only-runtime-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "OPERATIONS_RELAY_TEST_CONTROL_ADMIN_DATABASE_URL=postgresql://orvex_bootstrap_test:test-only-bootstrap-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "OPERATIONS_RELAY_TEST_TENANT_ADMIN_DATABASE_URL=postgresql://orvex_bootstrap_test:test-only-bootstrap-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "OPERATIONS_RELAY_TEST_CONTROL_API_DATABASE_URL=postgresql://orvex_control_api:test-only-control-api-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "OPERATIONS_RELAY_TEST_TENANT_RUNTIME_DATABASE_URL=postgresql://orvex_runtime:test-only-runtime-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "OPERATIONS_RELAY_TEST_CONTROL_RELAY_DATABASE_URL=postgresql://orvex_finance_audit_relay:test-only-relay-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "OPERATIONS_RELAY_TEST_TENANT_RELAY_DATABASE_URL=postgresql://orvex_finance_audit_relay:test-only-relay-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "TENANT_STAFF_TEST_ADMIN_DATABASE_URL=postgresql://orvex_bootstrap_test:test-only-bootstrap-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "TENANT_STAFF_TEST_API_DATABASE_URL=postgresql://orvex_control_api:test-only-control-api-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "SALES_TEST_ADMIN_DATABASE_URL=postgresql://orvex_bootstrap_test:test-only-bootstrap-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "SALES_TEST_RUNTIME_DATABASE_URL=postgresql://orvex_runtime:test-only-runtime-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "SALES_TEST_NETWORK_WORKER_DATABASE_URL=postgresql://orvex_network_worker:test-only-network-worker-not-production@127.0.0.1:${pg_port}/isp_test"
            echo "COLLECT_TEST_MIGRATION_URL=postgresql://orvex_migrator:test-only-migrator-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "COLLECT_TEST_RUNTIME_URL=postgresql://orvex_runtime:test-only-runtime-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "NETWORK_TEST_MIGRATION_URL=postgresql://orvex_migrator:test-only-migrator-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "NETWORK_TEST_DATABASE_URL=postgresql://orvex_network_worker:test-only-network-worker-not-production@127.0.0.1:${pg_port}/isp_tenant_template"
            echo "FINANCE_AUDIT_UPGRADE_BOOTSTRAP_DATABASE_URL=postgresql://orvex_finance_upgrade_bootstrap:test-only-bootstrap-not-production@127.0.0.1:${finance_upgrade_pg_port}/isp_finance_upgrade_test"
            echo "FINANCE_AUDIT_UPGRADE_MIGRATION_DATABASE_URL=postgresql://orvex_migrator:test-only-migrator-not-production@127.0.0.1:${finance_upgrade_pg_port}/isp_finance_upgrade_test"
            echo "DATABASE_UPGRADE_BOOTSTRAP_URL=postgresql://orvex_bootstrap_test:test-only-bootstrap-not-production@127.0.0.1:${pg_port}/isp_upgrade_test"
            echo "DATABASE_UPGRADE_MIGRATION_URL=postgresql://orvex_migrator:test-only-migrator-not-production@127.0.0.1:${pg_port}/isp_upgrade_test"
            echo "DATABASE_UPGRADE_RUNTIME_URL=postgresql://orvex_runtime:test-only-runtime-not-production@127.0.0.1:${pg_port}/isp_upgrade_test"
            echo "DATABASE_UPGRADE_LEGACY_OWNER=orvex_bootstrap_test"
            echo "DATABASE_UPGRADE_NAME=isp_upgrade_test"
            echo "REDIS_URL=redis://:test-only-not-production@127.0.0.1:${redis_port}/0"
            echo "OBJECT_STORAGE_ENDPOINT=http://127.0.0.1:${minio_port}"
          } >> "$GITHUB_ENV"
      - run: npm run test:integration
      - name: Capture dependency logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color
      - name: Stop isolated dependencies
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes

  finance-audit-relay-container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build Finance Audit Relay production image
        run: >-
          docker build --file workers/finance-audit-relay/Dockerfile --target runtime --tag
          orvex-isp-finance-audit-relay:${{ github.sha }} .
