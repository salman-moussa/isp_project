name: ${COMPOSE_PROJECT_NAME:-orvex-isp-test}

services:
  postgres-test:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    environment:
      POSTGRES_USER: orvex_bootstrap_test
      POSTGRES_PASSWORD: test-only-bootstrap-not-production
      POSTGRES_DB: isp_test
      ORVEX_RUNTIME_DB_PASSWORD: test-only-runtime-not-production
      ORVEX_CONTROL_API_DB_PASSWORD: test-only-control-api-not-production
      ORVEX_MIGRATOR_DB_PASSWORD: test-only-migrator-not-production
      ORVEX_FINANCE_AUDIT_RELAY_DB_PASSWORD: test-only-relay-not-production
      ORVEX_NETWORK_WORKER_DB_PASSWORD: test-only-network-worker-not-production
      ORVEX_CREATE_UPGRADE_TEST_DATABASE: '1'
      ORVEX_CREATE_FINANCE_AUDIT_UPGRADE_TEST_DATABASE: '1'
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql
    ports:
      - target: 5432
        published: '${POSTGRES_TEST_PORT:-55432}'
        host_ip: 127.0.0.1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orvex_bootstrap_test -d isp_test']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-application, test-data]
    security_opt: ['no-new-privileges:true']

  postgres-finance-upgrade-test:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine}
    environment:
      POSTGRES_USER: orvex_finance_upgrade_bootstrap
      POSTGRES_PASSWORD: test-only-bootstrap-not-production
      POSTGRES_DB: isp_finance_upgrade_test
      ORVEX_RUNTIME_DB_PASSWORD: test-only-runtime-not-production
      ORVEX_CONTROL_API_DB_PASSWORD: test-only-control-api-not-production
      ORVEX_MIGRATOR_DB_PASSWORD: test-only-migrator-not-production
      ORVEX_FINANCE_AUDIT_RELAY_DB_PASSWORD: test-only-relay-not-production
      ORVEX_NETWORK_WORKER_DB_PASSWORD: test-only-network-worker-not-production
      ORVEX_CREATE_FINANCE_AUDIT_RELAY_ROLES: '0'
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/docker/postgres/admin:/orvex-admin:ro
    tmpfs:
      - /var/lib/postgresql
    ports:
      - target: 5432
        published: '${POSTGRES_FINANCE_UPGRADE_TEST_PORT:-55433}'
        host_ip: 127.0.0.1
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U orvex_finance_upgrade_bootstrap -d isp_finance_upgrade_test']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-application, test-data]
    security_opt: ['no-new-privileges:true']

  redis-test:
    image: ${REDIS_IMAGE:-redis:8.8.0-alpine}
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--requirepass',
        'test-only-not-production',
      ]
    tmpfs:
      - /data
    ports:
      - target: 6379
        published: '${REDIS_TEST_PORT:-56379}'
        host_ip: 127.0.0.1
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli --no-auth-warning -a test-only-not-production ping | grep PONG']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-application, test-data]
    security_opt: ['no-new-privileges:true']

  minio-test:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: orvex_test_admin
      MINIO_ROOT_PASSWORD: test-only-not-production-minio
    tmpfs:
      - /data
    ports:
      - target: 9000
        published: '${MINIO_TEST_PORT:-59000}'
        host_ip: 127.0.0.1
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test-application, test-data]
    security_opt: ['no-new-privileges:true']

  mailpit-test:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.30.0}
    environment:
      MP_MAX_MESSAGES: '100'
      MP_MAX_AGE: 1h
    ports:
      - target: 1025
        published: '${MAILPIT_SMTP_TEST_PORT:-51025}'
        host_ip: 127.0.0.1
      - target: 8025
        published: '${MAILPIT_HTTP_TEST_PORT:-58025}'
        host_ip: 127.0.0.1
    networks: [test-application]
    security_opt: ['no-new-privileges:true']

networks:
  test-application:
  test-data:
    internal: true
